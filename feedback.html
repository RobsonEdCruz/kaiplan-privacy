<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fbf8ef">
    <title>Feedback e Bugs — Kaiplan</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <nav class="nav" aria-label="Navegação principal">
        <a class="brand" href="index.html">Kaiplan</a>
        <div class="links">
          <a href="features.html">Recursos</a>
          <a href="screenshots.html">Capturas</a>
          <a href="learning.html">Aprendizado</a>
          <a href="privacy.html">Privacidade</a>
          <a href="terms.html">Termos</a>
          <a href="support.html">Suporte</a>
          <a href="feedback.html" aria-current="page">Feedback</a>
        </div>
      </nav>
    </header>
    <main class="content">
      <p class="eyebrow">Ajude o Kaiplan a evoluir</p>
      <h1>Feedback e reporte de bugs</h1>
      <p>Este formulário é visual e pode ser ligado futuramente a e-mail, GitHub Issues, Google Forms ou backend próprio.</p>
      <form class="form-card">
        <label>Tipo
          <select>
            <option>Bug</option>
            <option>Sugestão</option>
            <option>Elogio</option>
          </select>
        </label>
        <label>Seu e-mail
          <input type="email" placeholder="voce@email.com">
        </label>
        <label>Mensagem
          <textarea placeholder="Conte o que aconteceu ou o que gostaria de ver no Kaiplan."></textarea>
        </label>
        <button class="button" type="button">Enviar em breve</button>
      </form>
    </main>
    <footer class="footer">Kaiplan · Feedback</footer>
  </body>
</html>
